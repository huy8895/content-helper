<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Content Helper – Settings</title>
  <meta name="description" content="Quản lý cấu hình cho Content Helper Extension">
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="app-layout">
    <!-- ======== SIDEBAR ======== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <h1>
          <span class="brand-icon">
            <svg class="ts-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>
          </span>
          Content Helper
        </h1>
        <div class="version">v1.0.1 – Settings</div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Cấu hình</div>

        <button class="nav-item active" data-section="speech">
          <span class="nav-icon">
            <svg class="ts-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          </span>
          Speech Profiles
        </button>

        <button class="nav-item" data-section="youtube">
          <span class="nav-icon">
            <svg class="ts-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          </span>
          YouTube Profiles
        </button>

        <button class="nav-item" data-section="scenarios">
          <span class="nav-icon">
            <svg class="ts-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
          </span>
          Scenarios
        </button>

        <button class="nav-item" data-section="flows">
          <span class="nav-icon">
            <svg class="ts-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></svg>
          </span>
          Flows
        </button>

        <button class="nav-item" data-section="buttons">
          <span class="nav-icon">
            <svg class="ts-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/></svg>
          </span>
          Button Settings
        </button>

        <div class="nav-section-label" style="margin-top:16px">Khác</div>

        <button class="nav-item" data-section="about">
          <span class="nav-icon">
            <svg class="ts-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          </span>
          Giới thiệu
        </button>
      </nav>

      <!-- Thông tin user -->
      <div class="sidebar-user" id="sidebar-user" style="display:none">
        <img id="sidebar-avatar" src="" alt="Avatar">
        <div class="user-info">
          <div class="user-name" id="sidebar-name">User</div>
          <div class="user-email" id="sidebar-email">email@example.com</div>
        </div>
      </div>
    </aside>

    <!-- ======== MAIN CONTENT ======== -->
    <main class="main-content" id="main-content">
      <!-- Content sẽ được inject bởi các module -->
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scenario Editor Overlay -->
  <div class="editor-overlay" id="scenario-editor-overlay">
    <div class="editor-panel">
      <div class="editor-header">
        <h3 id="editor-title">Chỉnh sửa kịch bản</h3>
        <button class="btn btn-ghost btn-xs" id="editor-close" style="height:24px;width:24px;padding:0;border:none;display:flex;align-items:center;justify-content:center">
          <svg class="ts-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="editor-body" id="editor-body"></div>
      <div class="editor-footer">
        <button class="btn btn-ghost" id="editor-cancel">Hủy</button>
        <button class="btn btn-primary" id="editor-save">Lưu kịch bản</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../libs/firebase-app-compat.js"></script>
  <script src="../libs/firebase-firestore-compat.js"></script>
  <script src="../content/firestore-helper.js"></script>
  <script src="../content/Icons.js"></script>
  <script src="shared/BaseModule.js"></script>
  <script src="modules/SpeechProfileModule.js"></script>
  <script src="modules/YoutubeProfileModule.js"></script>
  <script src="modules/ScenarioModule.js"></script>
  <script src="modules/FlowModule.js"></script>
  <script src="modules/ButtonConfigModule.js"></script>
  <script src="options.js"></script>
</body>
</html>
