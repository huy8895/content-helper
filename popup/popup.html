<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <title>Content Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <!-- Header với logo cơ học chuẩn Calm Tech -->
  <header class="popup-header">
    <div class="popup-brand">
      <span class="popup-brand-icon">
        <svg class="ts-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>
        </svg>
      </span>
      <span class="popup-title">Content Helper</span>
    </div>
    <span class="popup-version">v1.0.1</span>
  </header>

  <main class="popup-card">
    <!-- Loading State: thanh bar mỏng thanh lịch, không che chắn thô thiển -->
    <div id="loading" class="hidden">
      <div class="loading-bar"></div>
      <span>Đang đồng bộ dữ liệu...</span>
    </div>

    <!-- Login Section -->
    <div id="login-section">
      <p class="welcome-label">Tài Khoản Google</p>
      <p class="welcome-desc">
        Đăng nhập để tự động sao lưu và đồng bộ kịch bản qua Cloud Firestore.
      </p>

      <button id="google-login-btn" class="btn-google">
        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="G">
        <span>Tiếp tục với Google</span>
      </button>
    </div>

    <!-- User Section -->
    <div id="user-section" class="hidden">
      <div class="user-avatar-wrapper">
        <img id="user-avatar" src="" alt="Avatar">
      </div>

      <h2 id="user-name">User Name</h2>
      <p id="user-email">user@example.com</p>

      <button id="google-logout-btn" class="btn-logout">
        Đăng xuất tài khoản
      </button>
    </div>

    <!-- Status Message -->
    <div id="status"></div>
  </main>

  <footer class="popup-footer">
    <span class="footer-tag">WORKFLOW ASSISTANT</span>
    <button id="open-settings-btn">
      <svg class="ts-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
      </svg>
      <span>Cài đặt</span>
    </button>
  </footer>

  <script src="popup.js"></script>
</body>

</html>
